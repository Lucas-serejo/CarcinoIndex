name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/carcinoindex_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carcinoindex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carcinoindex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run CPU-compatible tests
        run: python -m pytest -q -ra -m "not sam2_integration and not sam2_api_integration"
